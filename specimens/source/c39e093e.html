<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https: http:; img-src * data:; font-src * data:; media-src * data:; script-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIELDNOTE</title>
<style>
  :root {
    --bg: #FAFAFA;
    --text: #111111;
    --muted: #888888;
    --line: #111111;
    --font-heading: 'Helvetica Neue', 'Arial', sans-serif;
    --font-body: 'Helvetica Neue', 'Arial', sans-serif;
  }
  
  * { box-sizing: border-box; }
  
  html, body { overflow-x: hidden; }
  body { 
    margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); 
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  
  h1, h2, h3, h4 { margin: 0; text-transform: uppercase; line-height: 0.9; letter-spacing: -0.03em; font-weight: 600; }
  
  .header { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 100;}
  .brand { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.05em; text-transform: uppercase; }
  .collection { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;}
  
  .hero { display: grid; grid-template-columns: repeat(12, 1fr); border-bottom: 2px solid var(--line); min-height: 85vh; }
  
  .hero-image-wrap { grid-column: 1 / 7; border-right: 2px solid var(--line); display: flex; flex-direction: column; background: #EEE; }
  .hero-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; mix-blend-mode: multiply;}
  
  .hero-text { grid-column: 7 / 13; display: flex; flex-direction: column; justify-content: space-between; padding: 4rem 2rem; }
  .hero-title { font-size: clamp(6rem, 12vw, 15rem); line-height: 0.8; letter-spacing: -0.05em; }
  .hero-desc { font-size: clamp(2rem, 3.5vw, 4rem); max-width: 15ch; line-height: 1.1; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 2rem;}
  
  .main-section { display: grid; grid-template-columns: repeat(12, 1fr); border-bottom: 2px solid var(--line); }
  
  .main-left { grid-column: 1 / 7; border-right: 2px solid var(--line); display: grid; grid-template-rows: repeat(3, 1fr); }
  .spec-block { padding: 3rem 2rem; border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; }
  .spec-block:last-child { border-bottom: none; }
  .spec-title { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;}
  .spec-value { font-size: clamp(3rem, 5vw, 6rem); font-weight: 600; letter-spacing: -0.04em; line-height: 0.9;}
  
  .main-right { grid-column: 7 / 13; display: flex; flex-direction: column; padding: 4rem 2rem; justify-content: center;}
  .spec-item { display: flex; justify-content: space-between; border-bottom: 2px solid var(--line); padding: 2rem 0; font-size: clamp(1.5rem, 2.5vw, 3rem); font-weight: 600; text-transform: uppercase; letter-spacing: -0.03em;}
  .spec-item:last-child { border-bottom: none; }
  
  .colors { display: grid; grid-template-columns: repeat(12, 1fr); border-bottom: 2px solid var(--line); }
  .colors-header { grid-column: 1 / 4; padding: 4rem 2rem; border-right: 2px solid var(--line); display: flex; align-items: center; }
  .colors-title { font-size: clamp(3rem, 4vw, 5rem); }
  
  .color-grid { grid-column: 4 / 13; display: grid; grid-template-columns: repeat(3, 1fr); }
  .color-card { padding: 4rem 2rem; border-right: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center;}
  .color-card:last-child { border-right: none; }
  .color-swatch { width: 100%; aspect-ratio: 1; border: 2px solid var(--line); margin-bottom: 3rem; }
  .swatch-black { background: #000; }
  .swatch-bone { background: #E8E5DF; }
  .swatch-safety { background: #FF4500; }
  .color-name { font-size: clamp(1.5rem, 2vw, 2.5rem); font-weight: 600; text-transform: uppercase; letter-spacing: -0.02em; text-align: center;}
  
  .purchase { display: flex; }
  .btn { width: 100%; text-align: center; font-size: clamp(4rem, 8vw, 10rem); font-weight: 700; text-transform: uppercase; background: var(--text); color: var(--bg); padding: 4rem 2rem; text-decoration: none; transition: background 0.2s, color 0.2s; letter-spacing: -0.04em;}
  .btn:hover, .btn:focus { background: var(--bg); color: var(--text); outline: none; }
  
  @media (max-width: 1024px) {
    .hero-image-wrap { grid-column: 1 / 13; border-right: none; border-bottom: 2px solid var(--line); min-height: 50vh;}
    .hero-text { grid-column: 1 / 13; padding: 4rem 2rem; min-height: 40vh;}
    
    .main-left { grid-column: 1 / 13; border-right: none; border-bottom: 2px solid var(--line); }
    .main-right { grid-column: 1 / 13; }
    
    .colors-header { grid-column: 1 / 13; border-right: none; border-bottom: 2px solid var(--line); }
    .color-grid { grid-column: 1 / 13; }
  }
  
  @media (max-width: 768px) {
    .header { padding: 1.5rem; }
    .hero-text { padding: 3rem 1.5rem; }
    .hero-title { font-size: 25vw; }
    .spec-block { padding: 2rem 1.5rem; flex-direction: column; align-items: flex-start; gap: 0.5rem;}
    .main-right { padding: 2rem 1.5rem; }
    .colors-header { padding: 3rem 1.5rem; }
    .color-grid { grid-template-columns: 1fr; }
    .color-card { border-right: none; border-bottom: 2px solid var(--line); padding: 4rem 1.5rem;}
    .color-card:last-child { border-bottom: none; }
    .color-swatch { width: 60%; }
    .btn { padding: 3rem 1.5rem; font-size: 15vw; }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">FIELDNOTE</div>
    <div class="collection">DAILY 01</div>
  </div>
  
  <div class="hero">
    <div class="hero-image-wrap">
      <img src="file:///C:/Users/johnp/.gemini/antigravity-ide/brain/109da52d-8291-4985-9c5c-b8e6f2abe88c/fieldnote_notebook_1787607362960.jpg" alt="Fieldnote Notebook" />
    </div>
    <div class="hero-text">
      <div class="hero-desc">The essential A5 notebook. Engineered for durability, structured for clarity.</div>
      <h1 class="hero-title">DAILY<br>01</h1>
    </div>
  </div>
  
  <div class="main-section">
    <div class="main-left">
      <div class="spec-block">
        <div class="spec-title">Pages</div>
        <div class="spec-value">192</div>
      </div>
      <div class="spec-block">
        <div class="spec-title">Paper Weight</div>
        <div class="spec-value">100 GSM</div>
      </div>
      <div class="spec-block">
        <div class="spec-title">Interior System</div>
        <div class="spec-value">Dot Grid</div>
      </div>
    </div>
    
    <div class="main-right">
      <div class="spec-item"><span>Format</span><span>A5</span></div>
      <div class="spec-item"><span>Binding</span><span>Lay-Flat</span></div>
      <div class="spec-item"><span>Cover</span><span>Soft-Touch</span></div>
      <div class="spec-item"><span>Origin</span><span>Made in Japan</span></div>
    </div>
  </div>
  
  <div class="colors">
    <div class="colors-header">
      <h2 class="colors-title">AVAILABLE<br>FINISHES</h2>
    </div>
    <div class="color-grid">
      <div class="color-card">
        <div class="color-swatch swatch-black"></div>
        <div class="color-name">Black</div>
      </div>
      <div class="color-card">
        <div class="color-swatch swatch-bone"></div>
        <div class="color-name">Bone</div>
      </div>
      <div class="color-card">
        <div class="color-swatch swatch-safety"></div>
        <div class="color-name">Safety Orange</div>
      </div>
    </div>
  </div>
  
  <div class="purchase">
    <a href="#" class="btn">ACQUIRE</a>
  </div>
</body>
</html>
