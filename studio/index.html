<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lemonteed Studio</title>
    <link rel="stylesheet" href="/studio/studio.css">
    <script src="/studio/studio.js" defer></script>
  </head>
  <body>
    <header class="studio-header">
      <div>
        <p class="eyebrow">Local static CMS</p>
        <h1>Lemonteed Studio</h1>
      </div>
      <a href="/index.html" target="_blank" rel="noreferrer">View site</a>
    </header>

    <main class="studio-shell">
      <section class="upload-panel" aria-labelledby="upload-title">
        <div class="panel-heading">
          <h2 id="upload-title">Add Projects</h2>
          <p>Upload one image or a batch. Studio suggests titles from filenames, then builds each entry into the static gallery.</p>
        </div>

        <form class="category-form" data-category-form>
          <label>
            <span>New series</span>
            <input name="label" type="text" autocomplete="off" placeholder="Unhinged Interfaces">
          </label>
          <label>
            <span>ID prefix</span>
            <input name="prefix" type="text" autocomplete="off" placeholder="ui">
          </label>
          <button type="submit">Add Series</button>
        </form>

        <form class="project-form" data-project-form>
          <label class="span-2">
            <span>Images</span>
            <input name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple required data-file-input>
          </label>

          <label>
            <span>Category</span>
            <select name="category" required data-category-select></select>
          </label>

          <label>
            <span>Year</span>
            <input name="year" type="text" inputmode="numeric" placeholder="2026">
          </label>

          <label class="span-2">
            <span>Shared description</span>
            <textarea name="description" rows="3" placeholder="Optional. Applied to every selected image in this upload."></textarea>
          </label>

          <label class="checkbox-row">
            <input name="visible" type="checkbox" checked>
            <span>Visible in gallery</span>
          </label>

          <div class="pending-list" data-pending-list aria-live="polite"></div>

          <button class="submit-button" type="submit">Upload Batch + Build</button>
        </form>

        <p class="status" data-status role="status"></p>
      </section>

      <section class="projects-panel" aria-labelledby="projects-title">
        <div class="panel-heading">
          <h2 id="projects-title">Archive</h2>
          <p><span data-count>0</span> projects. Hide keeps files. Delete removes the record and image set.</p>
        </div>

        <div class="studio-tools">
          <div class="toolbar" aria-label="Entry filters">
            <button type="button" data-filter="all" class="is-active">All</button>
            <button type="button" data-filter="visible">Visible</button>
            <button type="button" data-filter="hidden">Hidden</button>
          </div>

          <div class="toolbar" aria-label="Entry views">
            <button type="button" data-view="cards" class="is-active">Card View</button>
            <button type="button" data-view="list">List View</button>
          </div>

          <div class="import-export-tools">
            <button type="button" data-export>Export Data</button>
            <select data-import-mode aria-label="Import mode">
              <option value="merge">Merge import</option>
              <option value="replace">Replace all</option>
            </select>
            <input type="file" accept="application/json,.json" data-import-file aria-label="Import JSON data">
            <button type="button" data-import>Import Data</button>
          </div>
        </div>

        <div class="project-list" data-project-list></div>
      </section>
    </main>

    <div class="edit-layer" data-edit-layer hidden>
      <div class="edit-scrim" aria-hidden="true"></div>
      <aside class="edit-drawer" data-edit-drawer role="dialog" aria-modal="true" aria-labelledby="edit-title"></aside>
    </div>
  </body>
</html>
