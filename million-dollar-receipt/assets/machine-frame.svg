<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="mdrBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454340"/>
      <stop offset="45%" stop-color="#2a2826"/>
      <stop offset="100%" stop-color="#0e0d0c"/>
    </linearGradient>
    <linearGradient id="mdrScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1b19"/>
      <stop offset="100%" stop-color="#090908"/>
    </linearGradient>
    <linearGradient id="mdrPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22201e"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="mdrBay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#353330"/>
      <stop offset="100%" stop-color="#1a1917"/>
    </linearGradient>
  </defs>
  <!-- Outer chassis -->
  <rect x="6" y="6" width="468" height="548" rx="8" fill="url(#mdrBezel)" stroke="#070706" stroke-width="2"/>
  <rect x="14" y="14" width="452" height="532" rx="6" fill="none" stroke="#3a3835" stroke-width="1"/>
  <!-- Top status strip (minimal) -->
  <rect x="28" y="28" width="424" height="36" rx="3" fill="#161514" stroke="#2f2d2b"/>
  <circle cx="48" cy="46" r="5" fill="#39ff14" opacity="0.85"/>
  <text x="72" y="50" fill="#5c5c5c" font-family="IBM Plex Mono, Courier New, monospace" font-size="7" letter-spacing="1.4">LNW · REG 01</text>
  <!-- Main processing viewport (generous negative space) -->
  <rect x="28" y="76" width="424" height="212" rx="4" fill="url(#mdrScreen)" stroke="#333" stroke-width="2"/>
  <!-- Intake chute (left) -->
  <path d="M44 96 L44 168 L96 168 L112 132 L112 96 Z" fill="#141312" stroke="#3a3835" stroke-width="1"/>
  <!-- Conveyor trough (center, dominant) -->
  <rect x="116" y="120" width="228" height="72" rx="2" fill="#0a0908" stroke="#2a2826"/>
  <line x1="116" y1="178" x2="344" y2="178" stroke="#333" stroke-width="12" stroke-dasharray="16 8"/>
  <!-- Scanner arch (single event zone over belt) -->
  <path d="M236 112 L236 200 Q284 208 332 200 L332 112 Q284 104 236 112 Z" fill="none" stroke="#c8ff00" stroke-width="1" opacity="0.28"/>
  <!-- Receipt output module (right, unified) -->
  <rect x="356" y="96" width="84" height="168" rx="3" fill="#121110" stroke="#3a3835"/>
  <rect x="368" y="108" width="60" height="88" rx="2" fill="#0a0908" stroke="#333"/>
  <rect x="376" y="204" width="44" height="48" rx="1" fill="#080807" stroke="#2a2826"/>
  <!-- Terminal + action panel (below, connected) -->
  <rect x="28" y="304" width="424" height="148" rx="3" fill="url(#mdrPanel)" stroke="#333" stroke-width="1"/>
  <rect x="40" y="316" width="400" height="56" rx="2" fill="#080807" stroke="#222"/>
  <!-- Buy bay recess (mechanical extension of terminal) -->
  <rect x="40" y="384" width="400" height="56" rx="3" fill="url(#mdrBay)" stroke="#2a2826"/>
  <rect x="140" y="392" width="200" height="40" rx="2" fill="#0a0908" stroke="#444"/>
</svg>
