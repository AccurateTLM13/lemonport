name: Deploy to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.BLUEHOST_SSH_KEY }}

      - name: Trust Bluehost host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.BLUEHOST_PORT }}" "${{ secrets.BLUEHOST_HOST }}" >> ~/.ssh/known_hosts

      - name: Remove CMS paths from production
        run: |
          ssh -p "${{ secrets.BLUEHOST_PORT }}" \
            "${{ secrets.BLUEHOST_USER }}@${{ secrets.BLUEHOST_HOST }}" \
            "rm -rf '${{ secrets.BLUEHOST_PATH }}/content' '${{ secrets.BLUEHOST_PATH }}/studio' '${{ secrets.BLUEHOST_PATH }}/scripts' '${{ secrets.BLUEHOST_PATH }}/.studio-uploads' '${{ secrets.BLUEHOST_PATH }}/.studio-backups'"

      - name: Deploy static files
        run: |
          rsync -avz \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".gitignore" \
            --exclude ".DS_Store" \
            --exclude "Thumbs.db" \
            --exclude "content/" \
            --exclude "studio/" \
            --exclude "scripts/" \
            --exclude ".studio-uploads/" \
            --exclude ".studio-backups/" \
            -e "ssh -p ${{ secrets.BLUEHOST_PORT }}" \
            ./ "${{ secrets.BLUEHOST_USER }}@${{ secrets.BLUEHOST_HOST }}:${{ secrets.BLUEHOST_PATH }}"
